[package]
name = "hoop_stats"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
dotenvy = "0.15"
argon2 = "0.5.3"
jsonwebtoken = "9.3"
chrono = "0.4"
futures = "0.3"
dashmap = "5.5"