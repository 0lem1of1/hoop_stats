name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The repo ships a committed .sqlx cache, so query! macros check against
  # that instead of a live database at compile time.
  SQLX_OFFLINE: "true"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoop_stats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Only read at test runtime (by tests/ingest_db.rs), not at compile
      # time — SQLX_OFFLINE above covers the query! macros. This is what
      # lets the two DB-backed regression tests actually run instead of
      # skipping themselves.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hoop_stats

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets
